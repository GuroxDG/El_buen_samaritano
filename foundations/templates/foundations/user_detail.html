{% extends 'base.html' %}
{% load static %}

{% block section %}
<section class="content-header">
  <div class="container">
    <div class="row">
      <div class="col-sm-12">
        <h1>Detalle de Amigo</h1>
      </div>
    </div>
  </div>
</section>
{% endblock section %}

{% block maincontent %}
<div class="container mt-4">
  <ul class="list-group">

    {% if object.email %}
      <li class="list-group-item"><strong>Correo:</strong> {{ object.email }}</li>
    {% else %}
      <li class="list-group-item"><strong>Correo:</strong> Sin Correo</li>
    {% endif %}



  </ul>
</div>
{% endblock maincontent %}
